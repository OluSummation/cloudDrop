name: CloudDrop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image
        run: docker build -t clouddrop:test .

      - name: Start Docker container
        run: |
          docker run -d \
            --name clouddrop-test \
            -p 3000:3000 \
            clouddrop:test

      - name: Wait for application
        run: sleep 5

      - name: Health check
        run: curl --fail http://localhost:3000/health

      - name: Show container logs
        if: always()
        run: docker logs clouddrop-test
